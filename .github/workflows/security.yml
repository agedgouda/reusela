name: security

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
  schedule:
    # Weekly, so newly published advisories are caught even without new commits
    - cron: '0 14 * * 1'

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Composer audit
        run: composer audit --locked --no-interaction

      - name: npm audit
        run: npm audit --audit-level=high

  static-analysis:
    name: Larastan
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Larastan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7

      - name: Run Semgrep
        run: semgrep scan --config p/php --config p/secrets --error --exclude vendor --exclude node_modules --exclude public/build
