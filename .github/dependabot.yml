version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      # All open security fixes for this ecosystem arrive as one PR
      composer-security:
        applies-to: security-updates
        patterns: ['*']
      composer-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # Major upgrades (e.g. Livewire 3 -> 4) need a deliberate migration
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']
